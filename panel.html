<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Panel de Empleados</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .btn { background: #3498db; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; display: inline-block; }
    .btn-danger { background: #e74c3c; padding: 5px 10px; font-size: 13px; border:none; cursor:pointer; border-radius:3px; color:white;}
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #2c3e50; color: white; }
    img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
</style>
</head>
<body>
    <script>
        const empleado = JSON.parse(localStorage.getItem('empleado_tienda'));
        if (!empleado) window.location.href = 'login.html';
    </script>

    <a href="index.html">&larr; Ver página principal</a>
    <h1>Panel de Gestión de Prendas</h1>
    <a href="subir.html" class="btn">+ Subir Nueva Prenda</a>
    <button id="logout" class="btn" style="background:#95a5a6; float:right; border:none; cursor:pointer;">Cerrar Sesión</button>

    <table>
        <thead>
            <tr><th>Foto</th><th>Nombre</th><th>Subcategoría</th><th>Precio</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla-productos">
            <tr><td colspan="5" style="text-align:center;">Cargando...</td></tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('empleado_tienda');
            window.location.href = 'index.html';
        });

        async function cargarPanel() {
            const tbody = document.getElementById('tabla-productos');
            const { data: productos } = await supabaseClient.from('productos').select(`*, subcategorias(nombre)`);
            
            if (!productos || productos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay prendas registradas.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            productos.forEach(prod => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${prod.imagen_url}" alt="Prenda"></td>
                        <td>${prod.nombre}</td>
                        <td>${prod.subcategorias?.nombre || ''}</td>
                        <td>$${Number(prod.precio).toFixed(2)}</td>
                        <td>
                            <button class="btn-danger" onclick="eliminarPrenda(${prod.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function eliminarPrenda(id) {
            if (confirm('¿Estás seguro de eliminar esta prenda?')) {
                await supabaseClient.from('productos').delete().eq('id', id);
                cargarPanel();
            }
        }

        window.addEventListener('DOMContentLoaded', cargarPanel);
    </script>
</body>
</html>
